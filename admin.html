<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玉梅农业官网 · 可视化编辑器</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  font-size: 14px;
  line-height: 1.6;
}
.app {
  display: grid;
  grid-template-columns: 420px 1fr;
  height: 100vh;
  overflow: hidden;
}
.sidebar {
  background: #fff;
  border-right: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 16px 20px;
  background: linear-gradient(135deg, #1B4332, #0369A1);
  color: #fff;
}
.sidebar-header h1 { font-size: 16px; margin-bottom: 4px; }
.sidebar-header p { font-size: 12px; opacity: .85; }
.tabs {
  display: flex;
  border-bottom: 1px solid #e2e8f0;
  background: #f8fafc;
  overflow-x: auto;
}
.tab {
  padding: 10px 16px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  color: #64748b;
}
.tab.active { color: #1B4332; border-bottom-color: #1B4332; background: #fff; font-weight: 600; }
.tab-content {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px;
}
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  color: #64748b;
  margin-bottom: 4px;
  font-weight: 500;
}
.field input[type="text"],
.field input[type="number"],
.field textarea,
.field select {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  background: #fff;
}
.field textarea { min-height: 60px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: #1B4332; box-shadow: 0 0 0 3px rgba(27,67,50,.1);
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.img-upload {
  display: flex;
  align-items: center;
  gap: 10px;
}
.img-upload .preview {
  width: 60px; height: 60px;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  background: #f8fafc;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}
.img-upload button {
  padding: 6px 12px;
  border: 1px solid #1B4332;
  background: #fff;
  color: #1B4332;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
.img-upload button:hover { background: #1B4332; color: #fff; }
.item-block {
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 12px;
  background: #f8fafc;
}
.item-block .item-title {
  font-weight: 600;
  color: #1B4332;
  margin-bottom: 10px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.item-block .remove-btn {
  background: #dc2626;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 11px;
  cursor: pointer;
}
.add-btn {
  width: 100%;
  padding: 8px;
  border: 1px dashed #1B4332;
  background: #fff;
  color: #1B4332;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  margin-bottom: 12px;
}
.add-btn:hover { background: #1B4332; color: #fff; }
.sidebar-footer {
  padding: 14px 20px;
  border-top: 1px solid #e2e8f0;
  background: #fff;
}
.btn-export {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #1B4332, #0369A1);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-export:hover { opacity: .9; }
.preview-area {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.preview-toolbar {
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  gap: 8px;
  align-items: center;
}
.preview-toolbar select {
  padding: 5px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 13px;
}
.preview-frame {
  flex: 1;
  border: none;
  background: #fff;
}
.hint {
  font-size: 11px;
  color: #94a3b8;
  margin-top: 4px;
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .preview-area { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <!-- 左侧编辑面板 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>🌿 玉梅农业官网编辑器</h1>
      <p>填表改内容 · 上传换图片 · 导出上传</p>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="company">公司信息</div>
      <div class="tab" data-tab="home">首页</div>
      <div class="tab" data-tab="products">产品</div>
      <div class="tab" data-tab="bases">基地</div>
      <div class="tab" data-tab="contact">联系</div>
    </div>
    <div class="tab-content" id="tabContent">
      <!-- 公司信息 -->
      <div class="tab-pane active" data-pane="company">
        <div class="field">
          <label>公司全称</label>
          <input type="text" id="c_name" value="宜宾玉梅种养殖有限责任公司">
        </div>
        <div class="field-row">
          <div class="field">
            <label>简称（导航显示）</label>
            <input type="text" id="c_short" value="玉梅农业">
          </div>
          <div class="field">
            <label>LOGO 文字</label>
            <input type="text" id="c_logo" value="玉">
          </div>
        </div>
        <div class="field">
          <label>联系电话</label>
          <input type="text" id="c_phone" value="13309097775">
        </div>
        <div class="field">
          <label>联系人</label>
          <input type="text" id="c_contact" value="毕伟">
        </div>
        <div class="field">
          <label>公司地址</label>
          <input type="text" id="c_address" value="四川省宜宾市临港经开区沙坪街道泡桐村4组57号">
        </div>
        <div class="field-row">
          <div class="field">
            <label>成立时间</label>
            <input type="text" id="c_est" value="2024年4月">
          </div>
          <div class="field">
            <label>注册资本</label>
            <input type="text" id="c_cap" value="300万元">
          </div>
        </div>
        <div class="field">
          <label>所属行业</label>
          <input type="text" id="c_industry" value="农业（种植与养殖）">
        </div>
        <div class="field">
          <label>主营业务</label>
          <textarea id="c_business">灵芝及道地中药材种植、菌包生产、初级农产品收购销售、智能农业管理、生态餐饮</textarea>
        </div>
        <div class="field">
          <label>品牌 slogan（页脚）</label>
          <input type="text" id="c_slogan" value="智酿灵芝 · 道地砂仁 · 甘甜桂圆">
        </div>
        <div class="field">
          <label>企业使命</label>
          <textarea id="c_mission">以科技赋能传统农业，以品牌重塑产地价值，让宜宾的好山好水孕育出走向更广阔市场的好产品。</textarea>
        </div>
        <div class="field">
          <label>发展愿景</label>
          <textarea id="c_vision">立足宜宾，辐射西南，面向全国。玉梅农业将持续深耕灵芝全产业链与川南道地中药材产业，致力于成为西南地区具有影响力的「菌—药—果」融合发展现代农企。</textarea>
        </div>
      </div>

      <!-- 首页 -->
      <div class="tab-pane" data-pane="home">
        <div class="field">
          <label>首页标签</label>
          <input type="text" id="h_tag" value="智慧农业 · 全产业链">
        </div>
        <div class="field">
          <label>主标题（用 | 换行）</label>
          <input type="text" id="h_title" value="从田间到餐桌|让宜宾好山好水 孕育">
        </div>
        <div class="field">
          <label>主标题高亮词</label>
          <input type="text" id="h_highlight" value="灵芝好产品">
        </div>
        <div class="field">
          <label>首页描述</label>
          <textarea id="h_desc">宜宾玉梅种养殖有限责任公司立足宜宾本土，围绕「特色种植、智能养殖、农旅融合」发展思路，依托川南得天独厚的气候与生态资源，以灵芝全产业链为核心，融合道地中药材种植与特色果品经营。</textarea>
        </div>
        <div class="field">
          <label>首页右侧大图</label>
          <div class="img-upload">
            <div class="preview" id="h_img_preview"></div>
            <button type="button" onclick="document.getElementById('h_img').click()">上传图片</button>
            <input type="file" id="h_img" accept="image/*" style="display:none">
          </div>
          <div class="hint">建议横向图片，800x400 以上</div>
        </div>
        <div class="field">
          <label>数据条（数字|标签，每行一条）</label>
          <textarea id="h_stats" style="min-height:100px">2024.4|公司成立时间
300万|注册资本（元）
5|核心产品线
2|种植基地</textarea>
        </div>
        <div class="field">
          <label>CTA 标题</label>
          <input type="text" id="h_cta" value="让一枚小小的灵芝，成为乡村振兴的产业支点">
        </div>
      </div>

      <!-- 产品 -->
      <div class="tab-pane" data-pane="products">
        <div id="productsList"></div>
        <button class="add-btn" onclick="addProduct()">+ 添加产品</button>
      </div>

      <!-- 基地 -->
      <div class="tab-pane" data-pane="bases">
        <div id="basesList"></div>
        <button class="add-btn" onclick="addBase()">+ 添加基地</button>
      </div>

      <!-- 联系 -->
      <div class="tab-pane" data-pane="contact">
        <div class="field">
          <label>联系电话</label>
          <input type="text" id="ct_phone" value="13309097775">
        </div>
        <div class="field">
          <label>联系人</label>
          <input type="text" id="ct_contact" value="毕伟 先生">
        </div>
        <div class="field">
          <label>公司地址</label>
          <input type="text" id="ct_address" value="四川省宜宾市临港经开区沙坪街道泡桐村4组57号">
        </div>
        <div class="field">
          <label>门店展示图</label>
          <div class="img-upload">
            <div class="preview" id="ct_store_preview"></div>
            <button type="button" onclick="document.getElementById('ct_store').click()">上传图片</button>
            <input type="file" id="ct_store" accept="image/*" style="display:none">
          </div>
        </div>
        <div id="storesList"></div>
        <button class="add-btn" onclick="addStore()">+ 添加门店</button>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="btn-export" onclick="exportSite()">📦 导出网站文件（ZIP）</button>
      <p class="hint" style="text-align:center;margin-top:8px;">导出后解压，上传到 GitHub 仓库根目录</p>
    </div>
  </div>

  <!-- 右侧预览 -->
  <div class="preview-area">
    <div class="preview-toolbar">
      <span style="font-size:13px;color:#64748b;">预览：</span>
      <select id="previewPage" onchange="renderPreview()">
        <option value="index">首页</option>
        <option value="about">关于我们</option>
        <option value="products">产品中心</option>
        <option value="contact">联系我们</option>
      </select>
      <span style="font-size:11px;color:#94a3b8;margin-left:auto;">修改左侧表单后自动更新预览</span>
    </div>
    <iframe class="preview-frame" id="previewFrame"></iframe>
  </div>
</div>

<script>
// ========== 数据模型 ==========
let data = {
  company: {},
  home: {},
  products: [],
  bases: [],
  contact: {}
};

// 默认产品数据
const defaultProducts = [
  { tag: "核心主打", name: "灵芝（子实体）", desc: "精选优良菌种，在泡桐村基地智能化恒温恒湿大棚中规范培育。生长过程全程监测温湿度、光照与基质数据，灵芝朵形饱满、菌盖厚实、色泽均匀、有效成分积累稳定。", spec: "📋 规格：整枝灵芝 / 灵芝切片 / 灵芝干品<br>🍵 用途：药膳煲汤、泡酒、保健茶饮、制药深加工原料", image: "" },
  { tag: "种植服务", name: "灵芝菌包", desc: "在标准化无菌车间内，按「配料—灭菌—接种—培养」一体化工艺流水线生产灵芝栽培菌包。菌种活力强、杂菌污染率低、出芝整齐、生长周期稳定。", spec: "👥 面向：种植户、家庭农场、农业合作社、研学体验基地<br>📦 方案：菌包 + 出芝技术指导整套方案", image: "" },
  { tag: "高端鲜食", name: "灵芝嫩芽", desc: "采收于灵芝生长初期的嫩梢幼芝，口感脆嫩、味道清鲜、药食同源，是近年来兴起的高端鲜食菌菜。适用于清炒、涮锅、凉拌、炖汤等多种烹饪方式。", spec: "🎯 定位：应季稀缺、现摘鲜配<br>🏪 渠道：高端餐饮、生鲜精品超市、社群团购", image: "" },
  { tag: "道地药材", name: "砂仁", desc: "砂仁既是名贵中药材，又是川南餐饮与酱酒行业重要的香料原料。公司依托观音基地及周边川南道地药材产区的气候土壤优势，开展砂仁规范化种植，并配套初级农产品收购、分选与烘干加工。", spec: "📋 规格：壳砂仁 / 砂仁果 / 砂仁干货<br>🍶 用途：中药材、川南餐饮、酱酒香料", image: "" },
  { tag: "特色果品", name: "桂圆", desc: "依托川南宜宾及周边产区资源，开展桂圆种植与初级农产品收购、分选、销售。供应鲜食桂圆与桂圆干果，应季上市，与中药材系列形成「药食 + 果品」的产品互补。", spec: "📋 规格：鲜食桂圆 / 桂圆干果<br>📅 应季上市，丰富终端货架与销售季节覆盖", image: "" }
];

// 默认基地
const defaultBases = [
  { icon: "🏢", name: "泡桐村基地", subtitle: "总部 · 智慧示范基地", desc: "位于宜宾临港经开区沙坪街道泡桐村，公司总部所在地与核心示范基地。重点布局灵芝智能化恒温恒湿大棚、灵芝菌包标准化生产车间与灵芝嫩芽鲜食种植区，是面向客户、政府与合作伙伴展示「智慧农业」形象的窗口。同时布局砂仁规范化种植，配套桂圆等本土特色果品。", image: "", tags: "灵芝智能大棚,菌包标准化车间,灵芝嫩芽种植" },
  { icon: "🌿", name: "观音基地 / 李庄基地", subtitle: "道地药材 · 规模种植区", desc: "位于宜宾观音一带，依托川南道地药材传统产区的土壤与气候条件，承担公司道地中药材与特色果品的规模化种植任务，与泡桐村基地形成「科技示范 + 生态规模」的双轮互补。", image: "", tags: "竹林下灵芝,灵芝嫩芽,川南道地药材" }
];

// 默认门店
const defaultStores = [
  { name: "门店一", address: "宜宾市上江北远达第一城正门左侧", note: "（祥醇烟酒行）" },
  { name: "门店二", address: "宜宾市下江北地中海南湾一期 4-2-103", note: "（领投智能科技馆）" }
];

// ========== 标签页切换 ==========
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelector(`.tab-pane[data-pane="${t.dataset.tab}"]`).classList.add('active');
  });
});

// ========== 图片转 base64 ==========
function imgToBase64(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.readAsDataURL(file);
  });
}

// ========== 产品编辑 ==========
function renderProducts() {
  const c = document.getElementById('productsList');
  c.innerHTML = '';
  data.products.forEach((p, i) => {
    c.innerHTML += `
      <div class="item-block">
        <div class="item-title">产品 ${i+1} <button class="remove-btn" onclick="removeProduct(${i})">删除</button></div>
        <div class="field-row">
          <div class="field">
            <label>标签</label>
            <input type="text" value="${p.tag}" onchange="data.products[${i}].tag=this.value;renderPreview()">
          </div>
          <div class="field">
            <label>产品名</label>
            <input type="text" value="${p.name}" onchange="data.products[${i}].name=this.value;renderPreview()">
          </div>
        </div>
        <div class="field">
          <label>描述</label>
          <textarea onchange="data.products[${i}].desc=this.value;renderPreview()">${p.desc}</textarea>
        </div>
        <div class="field">
          <label>规格/用途（支持 HTML，<br> 换行）</label>
          <textarea onchange="data.products[${i}].spec=this.value;renderPreview()">${p.spec}</textarea>
        </div>
        <div class="field">
          <label>产品图片</label>
          <div class="img-upload">
            <div class="preview" style="background-image:url('${p.image}')"></div>
            <button type="button" onclick="uploadProductImg(${i})">上传图片</button>
          </div>
        </div>
      </div>`;
  });
}
function addProduct() {
  data.products.push({ tag: "新产品", name: "新产品名称", desc: "产品描述", spec: "规格信息", image: "" });
  renderProducts();
  renderPreview();
}
function removeProduct(i) {
  data.products.splice(i, 1);
  renderProducts();
  renderPreview();
}
async function uploadProductImg(i) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async e => {
    data.products[i].image = await imgToBase64(e.target.files[0]);
    renderProducts();
    renderPreview();
  };
  input.click();
}

// ========== 基地编辑 ==========
function renderBases() {
  const c = document.getElementById('basesList');
  c.innerHTML = '';
  data.bases.forEach((b, i) => {
    const tags = b.tags.split(',').join(',');
    c.innerHTML += `
      <div class="item-block">
        <div class="item-title">基地 ${i+1} <button class="remove-btn" onclick="removeBase(${i})">删除</button></div>
        <div class="field-row">
          <div class="field">
            <label>图标（emoji）</label>
            <input type="text" value="${b.icon}" onchange="data.bases[${i}].icon=this.value;renderPreview()">
          </div>
          <div class="field">
            <label>基地名</label>
            <input type="text" value="${b.name}" onchange="data.bases[${i}].name=this.value;renderPreview()">
          </div>
        </div>
        <div class="field">
          <label>副标题</label>
          <input type="text" value="${b.subtitle}" onchange="data.bases[${i}].subtitle=this.value;renderPreview()">
        </div>
        <div class="field">
          <label>描述</label>

// ========== 实时预览 ==========
function renderPreview() {
  collectData();
  const page = document.getElementById('previewPage').value;
  const frame = document.getElementById('previewFrame');
  let html = '';
  if (page === 'index') html = renderIndex();
  else if (page === 'products') html = renderProducts();
  else if (page === 'about') html = renderAbout();
  else html = renderContact();
  frame.srcdoc = html;
}

// ========== 导出 ZIP ==========
async function exportSite() {
  collectData();
  const zip = new JSZip();
  zip.file('index.html', renderIndex());
  zip.file('about.html', renderAbout());
  zip.file('products.html', renderProducts());
  zip.file('contact.html', renderContact());
  // 复制 style.css（从现有网站获取）
  try {
    const cssResp = await fetch('assets/style.css');
    if (cssResp.ok) {
      const css = await cssResp.text();
      zip.file('assets/style.css', css);
    }
  } catch(e) {}
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'yumei-website.zip';
  a.click();
  URL.revokeObjectURL(url);
  alert('✅ 网站文件已导出！\n\n下一步：\n1. 解压 yumei-website.zip\n2. 登录 https://github.com/lie310225/yumei-agriculture\n3. 把解压出的 index.html、about.html、products.html、contact.html、assets 文件夹全部上传覆盖\n4. 等 1-2 分钟刷新网页即可');
}
